[project]
name = "autoapply"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CeasarMusk", email = "ceasarmusk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.65.2",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "sqlmodel>=0.0.50",
    "typer>=0.29.2",
]

[project.scripts]
autoapply = "autoapply:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
